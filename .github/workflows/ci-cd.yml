name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formatação)
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  version:
    name: Calcular versão
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Próxima versão (semver pelos commits)
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=$(cat VERSION)
          else
            base=${last#v}
            IFS=. read -r major minor patch <<< "$base"
            log=$(git log "$last"..HEAD --format='%s%n%b')
            if echo "$log" | grep -Eq 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
              major=$((major+1)); minor=0; patch=0
            elif echo "$log" | grep -Eq '^feat(\(.+\))?:'; then
              minor=$((minor+1)); patch=0
            else
              patch=$((patch+1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Versão: $next (anterior: ${last:-nenhuma})"

  docker:
    name: Build e publicação da imagem
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # QEMU: permite gerar a imagem ARM64 (ex.: VPS Oracle Ampere) no runner x86
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Tag e release no GitHub
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Criar release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: v${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          gh release create "$V" --target "$GITHUB_SHA" --title "$V" --generate-notes \
            --notes "Imagem Docker: \`$image:${V#v}\` (também \`$image:latest\`)"
