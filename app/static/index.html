<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>PostOp · Vídeos para TikTok</title>
  <link rel="icon" href="/static/favicon.svg?v={{v}}" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png?v={{v}}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{v}}">
  <link rel="manifest" href="/static/manifest.webmanifest?v={{v}}">
  <link rel="stylesheet" href="/static/styles.css?v={{v}}">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <div class="login-brand"><img class="logo lg" src="/static/logo.svg?v={{v}}" alt=""><span>Post<b>Op</b></span></div>
      <h1>Entrar</h1>
      <p class="muted">Crie vídeos verticais e poste no TikTok.</p>
      <label>Usuário<input name="username" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="PostOp, início"><img class="logo" src="/static/logo.svg?v={{v}}" alt=""><span>Post<b>Op</b></span></a>
      <nav id="nav" aria-label="Principal"></nav>
      <div class="sidebar-foot">
        <div id="health" class="health"></div>
        <div class="foot-row">
          <span id="version" class="muted small"></span>
          <button id="logout" class="icon-btn" type="button" title="Sair" aria-label="Sair"></button>
        </div>
      </div>
    </aside>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="PostOp, início"><img class="logo" src="/static/logo.svg?v={{v}}" alt=""><span>Post<b>Op</b></span></a>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <main id="view" class="main" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Atalhos"></nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
