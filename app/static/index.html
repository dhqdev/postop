<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostOp · Vídeos para TikTok</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <div class="brand big">🎬 PostOp</div>
      <p class="muted">Gerador de vídeos para TikTok</p>
      <label>Usuário<input name="username" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand">🎬 PostOp</div>
      <nav id="nav">
        <a href="#/" data-route="/">📊 Painel</a>
        <a href="#/youtube" data-route="/youtube">✂️ Cortes do YouTube</a>
        <a href="#/prompt3d" data-route="/prompt3d">🧊 Vídeo 3D por prompt</a>
        <a href="#/videos" data-route="/videos">🎞️ Vídeos</a>
        <a href="#/jobs" data-route="/jobs">⚙️ Processamentos</a>
        <a href="#/configuracoes" data-route="/configuracoes">🔧 Configurações</a>
        <a href="#/tiktok-guia" data-route="/tiktok-guia">📘 Passo a passo TikTok</a>
      </nav>
      <div class="sidebar-foot">
        <span id="version" class="muted small"></span>
        <button id="logout" class="btn ghost small">Sair</button>
      </div>
    </aside>
    <main id="view" class="main"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box card" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
