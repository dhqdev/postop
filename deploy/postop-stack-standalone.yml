# =====================================================================
# PostOp - stack 100% independente (Traefik + Postgres + app + worker)
#
# Use em um servidor que NÃO tem outro Traefik/proxy usando as portas 80 e 443.
# Se o servidor já tem o Traefik do n8n, use deploy/postop-stack.yml.
#
# Preencha os campos marcados com  <<< TROQUE.
# =====================================================================
version: "3.8"

x-env: &env
  TZ: America/Sao_Paulo
  ADMIN_USER: admin                                  # <<< TROQUE
  ADMIN_PASSWORD: troque-esta-senha                  # <<< TROQUE
  PUBLIC_URL: https://postop.seudominio.com          # <<< TROQUE
  SECRET_KEY: gere-com-openssl-rand-hex-32           # <<< TROQUE (openssl rand -hex 32)
  DATABASE_URL: postgresql://postop:SENHA_DO_POSTGRES@postop-db:5432/postop   # <<< TROQUE
  DATA_DIR: /data

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=postop_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencryptresolver.acme.email=voce@seudominio.com"   # <<< TROQUE
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - postop_letsencrypt:/letsencrypt
    networks:
      - postop_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  web:
    image: ghcr.io/dhqdev/postop:latest
    command: ["api"]
    environment: *env
    volumes:
      - postop_data:/data
    networks:
      - postop_internal
      - postop_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=postop_public"
        - "traefik.http.routers.postop.rule=Host(`postop.seudominio.com`)"   # <<< TROQUE
        - "traefik.http.routers.postop.entrypoints=websecure"
        - "traefik.http.routers.postop.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.postop-service.loadbalancer.server.port=8000"

  worker:
    image: ghcr.io/dhqdev/postop:latest
    command: ["worker"]
    environment: *env
    volumes:
      - postop_data:/data
    networks:
      - postop_internal
    healthcheck:
      disable: true
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s

  db:
    image: postgres:16-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: postop
      POSTGRES_PASSWORD: SENHA_DO_POSTGRES          # <<< TROQUE
      POSTGRES_DB: postop
    volumes:
      - postop_pgdata:/var/lib/postgresql/data
    networks:
      postop_internal:
        aliases:
          - postop-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postop -d postop"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      placement:
        constraints:
          - node.role == manager

volumes:
  postop_data:
    name: postop_data
  postop_pgdata:
    name: postop_pgdata
  postop_letsencrypt:
    name: postop_letsencrypt

networks:
  postop_internal:
    driver: overlay
    name: postop_internal
  postop_public:
    driver: overlay
    name: postop_public
    attachable: true
